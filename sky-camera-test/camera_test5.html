<!DOCTYPE html>

<body>

<video id="camera-video" playsinline autoplay muted></video>
<canvas id="star-canvas"></canvas>
<div id="status">準備中...</div>

<div id="test-mode-panel">
  <label>テスト用の日時（未入力なら現在時刻を使用）</label>

<div class="button-row">
  <button id="start-camera-button">① カメラ起動</button>
  <button id="start-sensor-button">② 位置情報＋センサー開始</button>
  <button id="toggle-test-mode-button">テスト日時モード</button>
  <button id="toggle-names-button">Name表示 ON/OFF</button>
</div>

<script>
// =========================================================
// 1. 天文計算ロジック（ステップ4から流用）
// =========================================================
function degToRad(d) { return d * Math.PI / 180; }
function radToDeg(r) { return r * 180 / Math.PI; }
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
function hmsToHours(h, m, s) { return h + m / 60 + s / 3600; }
function dmsToDegrees(sign, d, m, s) { return sign * (d + m / 60 + s / 3600); }

function getJulianDate(date) { return date.getTime() / 86400000 + 2440587.5; }
function getGMSTHours(date) {
  const JD = getJulianDate(date);
  const D = JD - 2451545.0;
  const T = D / 36525;
  let GMST = 280.46061837 + 360.98564736629 * D + 0.000387933 * T * T - (T * T * T) / 38710000;
  GMST = ((GMST % 360) + 360) % 360;
  return GMST / 15;
}
function getLST(date, lonDeg) {
  const gmst = getGMSTHours(date);
  let lst = gmst + lonDeg / 15;
  return ((lst % 24) + 24) % 24;
}
function raDecToAltAz(raHours, decDeg, latDeg, lstHours) {
  const H = (lstHours - raHours) * 15;
  const latRad = degToRad(latDeg), decRad = degToRad(decDeg), hRad = degToRad(H);
  const sinAlt = Math.sin(decRad) * Math.sin(latRad) + Math.cos(decRad) * Math.cos(latRad) * Math.cos(hRad);
  const alt = Math.asin(clamp(sinAlt, -1, 1));
  const cosAz = (Math.sin(decRad) - Math.sin(alt) * Math.sin(latRad)) / (Math.cos(alt) * Math.cos(latRad));
  let az = Math.acos(clamp(cosAz, -1, 1));
  if (Math.sin(hRad) > 0) az = Math.PI * 2 - az;
  return { altDeg: radToDeg(alt), azDeg: radToDeg(az) };
}

// 角度差分を -180〜180 の範囲に正規化する（新規追加: 画面投影に必要）
function normalizeAngleDiff(diff) {
  let d = diff % 360;
  if (d > 180) d -= 360;
  if (d < -180) d += 360;
  return d;
}

// =========================================================
// 2. オリオン座16星データ
// =========================================================
const starData = [
  { id: 's1',  name: 'Betelgeuse', ra: [5, 55, 10.3], dec: [+1, 7, 24, 25] },
  { id: 's2',  name: 'Meissa',     ra: [5, 35, 8.3],  dec: [+1, 9, 56, 3] },
  { id: 's3',  name: 'Bellatrix',  ra: [5, 25, 7.9],  dec: [+1, 6, 20, 59] },
  { id: 's4',  name: 'Rigel',      ra: [5, 14, 32.3], dec: [-1, 8, 12, 6] },
  { id: 's5',  name: 'Saiph',      ra: [5, 47, 45.4], dec: [-1, 9, 40, 11] },
  { id: 's6',  name: 'Alnitak',    ra: [5, 40, 45.5], dec: [-1, 1, 56, 34] },
  { id: 's7',  name: 'Alnilam',    ra: [5, 36, 12.8], dec: [-1, 1, 12, 7] },
  { id: 's8',  name: 'Mintaka',    ra: [5, 32, 0.4],  dec: [-1, 0, 17, 57] },
  { id: 's9',  name: 'Mu Ori',     ra: [6, 2, 23.0],  dec: [+1, 9, 38, 50] },
  { id: 's10', name: 'Xi Ori',     ra: [6, 11, 56.4], dec: [+1, 14, 12, 32] },
  { id: 's11', name: 'Nu Ori',     ra: [6, 7, 34.3],  dec: [+1, 14, 46, 7] },
  { id: 's12', name: 'Chi1 Ori',   ra: [5, 54, 23.0], dec: [+1, 20, 16, 35] },
  { id: 's13', name: 'Pi2 Ori',    ra: [4, 50, 36.7], dec: [+1, 8, 54, 1] },
  { id: 's14', name: 'Pi3 Ori',    ra: [4, 49, 50.4], dec: [+1, 6, 57, 41] },
  { id: 's15', name: 'Pi4 Ori',    ra: [4, 51, 12.4], dec: [+1, 5, 36, 18] },
  { id: 's16', name: 'Pi5 Ori',    ra: [4, 54, 15.1], dec: [+1, 2, 26, 26] },
];
starData.forEach(star => {
  star.raHours = hmsToHours(star.ra[0], star.ra[1], star.ra[2]);
  star.decDeg = dmsToDegrees(star.dec[0], star.dec[1], star.dec[2], star.dec[3]);
});

// =========================================================
// 2.5. 月の位置計算（新規追加：位置精度キャリブレーション用）
// =========================================================
// 参考: 簡易月位置アルゴリズム(Paul Schlyter方式、主要摂動項込み)
// Node.jsでJPL DE405基準値と照合し、RA誤差 約0.5分角、Dec誤差 約0.1分角を確認済み
//
// 恒星と違い、月は地球に近い(距離 約38万km、地球半径の約60倍)ため、
// 「視差補正」が必須となる。視差補正なしだと地平線付近で最大 約1度のズレが生じる
// (地心座標＝地球の中心から見た位置 と、地表の観測者から見た位置 の違い)

function getDaysSinceEpoch2000(date) {
  const y = date.getUTCFullYear();
  const m = date.getUTCMonth() + 1;
  const D = date.getUTCDate() +
    (date.getUTCHours() + date.getUTCMinutes() / 60 + date.getUTCSeconds() / 3600) / 24;
  return 367 * y - Math.floor(7 * (y + Math.floor((m + 9) / 12)) / 4) + Math.floor(275 * m / 9) + D - 730530;
}

function normalizeDeg360(deg) {
  let d = deg % 360;
  if (d < 0) d += 360;
  return d;
}

// 月の地心RA/Dec(度)と地心距離(地球半径単位)を計算
function getMoonGeocentric(date) {
  const d = getDaysSinceEpoch2000(date);

  // 月の軌道要素(元期2000.0からの経過日数dに対する近似式)
  const N = normalizeDeg360(125.1228 - 0.0529538083 * d); // 昇交点黄経
  const i = 5.1454;                                        // 軌道傾斜角
  const w = normalizeDeg360(318.0634 + 0.1643573223 * d);  // 近地点引数
  const a = 60.2666;                                       // 軌道長半径(地球半径単位)
  const e = 0.054900;                                      // 離心率
  const M = normalizeDeg360(115.3654 + 13.0649929509 * d); // 平均近点角

  // ケプラー方程式を反復法で解き、離心近点角Eを求める
  let E = degToRad(M) + e * Math.sin(degToRad(M)) * (1 + e * Math.cos(degToRad(M)));
  for (let iter = 0; iter < 5; iter++) {
    E -= (E - e * Math.sin(E) - degToRad(M)) / (1 - e * Math.cos(E));
  }

  const xv = a * (Math.cos(E) - e);
  const yv = a * (Math.sqrt(1 - e * e) * Math.sin(E));
  const v = normalizeDeg360(radToDeg(Math.atan2(yv, xv))); // 真近点角
  const r = Math.sqrt(xv * xv + yv * yv);                  // 地心距離(地球半径単位)

  const Nr = degToRad(N), ir = degToRad(i), vwr = degToRad(v + w);
  const xh = r * (Math.cos(Nr) * Math.cos(vwr) - Math.sin(Nr) * Math.sin(vwr) * Math.cos(ir));
  const yh = r * (Math.sin(Nr) * Math.cos(vwr) + Math.cos(Nr) * Math.sin(vwr) * Math.cos(ir));
  const zh = r * (Math.sin(vwr) * Math.sin(ir));

  let lonEcl = normalizeDeg360(radToDeg(Math.atan2(yh, xh)));
  let latEcl = radToDeg(Math.atan2(zh, Math.sqrt(xh * xh + yh * yh)));

  // 太陽の重力による主要な摂動項の補正(これがないと精度が数度落ちる)
  const wSun = 282.9404 + 4.70935e-5 * d;
  const Msun = normalizeDeg360(356.0470 + 0.9856002585 * d);
  const Ls = normalizeDeg360(Msun + wSun);   // 太陽の平均黄経
  const Lm = normalizeDeg360(M + w + N);     // 月の平均黄経
  const D_ = normalizeDeg360(Lm - Ls);       // 月の平均離角(太陽との角度差)
  const F = normalizeDeg360(Lm - N);         // 月の引数

  const Mm = degToRad(M), Dr = degToRad(D_), Msr = degToRad(Msun), Fr = degToRad(F);

  const lonCorr = -1.274 * Math.sin(Mm - 2 * Dr) + 0.658 * Math.sin(2 * Dr) - 0.186 * Math.sin(Msr)
    - 0.059 * Math.sin(2 * Mm - 2 * Dr) - 0.057 * Math.sin(Mm - 2 * Dr + Msr) + 0.053 * Math.sin(Mm + 2 * Dr)
    + 0.046 * Math.sin(2 * Dr - Msr) + 0.041 * Math.sin(Mm - Msr) - 0.035 * Math.sin(Dr)
    - 0.031 * Math.sin(Mm + Msr) - 0.015 * Math.sin(2 * Fr - 2 * Dr) + 0.011 * Math.sin(Mm - 4 * Dr);

  const latCorr = -0.173 * Math.sin(Fr - 2 * Dr) - 0.055 * Math.sin(Mm - Fr - 2 * Dr) - 0.046 * Math.sin(Mm + Fr - 2 * Dr)
    + 0.033 * Math.sin(Fr + 2 * Dr) + 0.017 * Math.sin(2 * Mm + Fr);

  const rCorr = -0.58 * Math.cos(Mm - 2 * Dr) - 0.46 * Math.cos(2 * Dr);

  lonEcl = normalizeDeg360(lonEcl + lonCorr);
  latEcl = latEcl + latCorr;
  const rGeo = r + rCorr;

  // 黄道座標 → 赤道座標(RA/Dec)へ変換
  const ecl = 23.4393 - 3.563e-7 * d; // 黄道傾斜角
  const eclr = degToRad(ecl);
  const lonR = degToRad(lonEcl), latR = degToRad(latEcl);

  const xg = rGeo * Math.cos(lonR) * Math.cos(latR);
  const yg = rGeo * Math.sin(lonR) * Math.cos(latR);
  const zg = rGeo * Math.sin(latR);

  const xe = xg;
  const ye = yg * Math.cos(eclr) - zg * Math.sin(eclr);
  const ze = yg * Math.sin(eclr) + zg * Math.cos(eclr);

  const raDeg = normalizeDeg360(radToDeg(Math.atan2(ye, xe)));
  const decDeg = radToDeg(Math.atan2(ze, Math.sqrt(xe * xe + ye * ye)));

  return { raDeg, decDeg, distanceEarthRadii: rGeo };
}

// 視差補正: 地心座標 → 観測地点から見た座標(トポセントリック座標)へ変換
function applyMoonParallax(raDeg, decDeg, distanceEarthRadii, latDeg, lstHours) {
  const lstDeg = lstHours * 15;
  const H = normalizeDeg360(lstDeg - raDeg); // 地方時角

  const phi = degToRad(latDeg);
  const Hr = degToRad(H);
  const decR = degToRad(decDeg);
  const sinPi = 1 / distanceEarthRadii; // 地平視差

  const denom = Math.cos(decR) - Math.cos(phi) * sinPi * Math.cos(Hr);
  const deltaAlpha = Math.atan2(-Math.cos(phi) * sinPi * Math.sin(Hr), denom);
  const decTopo = Math.atan2((Math.sin(decR) - Math.sin(phi) * sinPi) * Math.cos(deltaAlpha), denom);

  return {
    raDeg: normalizeDeg360(raDeg + radToDeg(deltaAlpha)),
    decDeg: radToDeg(decTopo)
  };
}

// 指定した日時・観測地点における月の視Alt/Az(高度・方位角、視差補正済み)を返す
function getMoonAltAz(date, latDeg, lonDeg, lstHours) {
  const geo = getMoonGeocentric(date);
  const topo = applyMoonParallax(geo.raDeg, geo.decDeg, geo.distanceEarthRadii, latDeg, lstHours);
  return raDecToAltAz(topo.raDeg / 15, topo.decDeg, latDeg, lstHours);
}

// =========================================================
// 3. 設定値（カメラ画角の仮の値。後でキャリブレーションが必要）
// =========================================================
const CONFIG = {
  FOV_HORIZONTAL_DEG: 60,  // 画面横方向が何度分に相当するか(仮)
  FOV_VERTICAL_DEG: 80,    // 画面縦方向が何度分に相当するか(仮、スマホ縦持ち想定)
  STAR_DOT_RADIUS: 5,
  MOON_DOT_RADIUS: 14,     // 月は星より大きく描画して区別する
};

// =========================================================
// 4. カメラ・センサー
// =========================================================
const videoEl = document.getElementById('camera-video');
const canvasEl = document.getElementById('star-canvas');
const ctx = canvasEl.getContext('2d');
const statusEl = document.getElementById('status');
const startCameraButton = document.getElementById('start-camera-button');
const startSensorButton = document.getElementById('start-sensor-button');
const toggleTestModeButton = document.getElementById('toggle-test-mode-button');
const toggleNamesButton = document.getElementById('toggle-names-button');
const testModePanel = document.getElementById('test-mode-panel');
const testDatetimeInput = document.getElementById('test-datetime');
const applyTestTimeButton = document.getElementById('apply-test-time');
const clearTestTimeButton = document.getElementById('clear-test-time');

let currentPosition = null;
let currentHeading = null;
let currentTilt = null;
let testDate = null; // nullなら現在時刻を使う

// Name機能用の状態
let showAllNames = false;           // ON/OFFボタンで切り替え
let tappedStar = null;              // { x, y, name, time } タップした星の情報
const TAP_LABEL_DURATION_MS = 4000; // タップ後、名前を表示し続ける時間
const TAP_HIT_RADIUS_PX = 40;       // タップ判定の許容範囲(px)
let starScreenPositions = [];       // 毎フレーム更新される、画面に描画された星の座標一覧

canvasEl.style.pointerEvents = 'auto'; // タップ判定のためcanvasへのポインタイベントを有効化

function resizeCanvas() {
  canvasEl.width = window.innerWidth;
  canvasEl.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

let wakeLock = null;
let cameraStream = null;

// 画面のスリープを防止する(対応端末のみ)。フリーズ対策の中心となる処理
async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
    }
  } catch (err) {
    console.log('[WakeLock] 取得失敗:', err.message);
  }
}

// タブ/画面が再度表示された際、WakeLockと映像の両方を復帰させる
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible') {
    if ('wakeLock' in navigator) {
      await requestWakeLock();
    }
    if (videoEl.paused && cameraStream) {
      videoEl.play().catch(() => {});
    }
  }
});

async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
    cameraStream = stream;
    videoEl.srcObject = stream;
    startCameraButton.disabled = true;
    await requestWakeLock();
  } catch (err) {
    alert('[カメラ] エラー: ' + err.name);
  }
}

function startGeolocation() {
  if (!navigator.geolocation) return;
  navigator.geolocation.watchPosition(
    (position) => {
      currentPosition = { latitude: position.coords.latitude, longitude: position.coords.longitude };
    },
    (err) => { console.error('[位置情報]', err.message); },
    { enableHighAccuracy: true, maximumAge: 5000, timeout: 10000 }
  );
}

function handleOrientation(event) {
  if (typeof event.webkitCompassHeading === 'number') {
    currentHeading = event.webkitCompassHeading;
  } else if (typeof event.alpha === 'number') {
    currentHeading = 360 - event.alpha;
  }
  if (typeof event.beta === 'number') {
    currentTilt = event.beta;
  }
}

async function startSensors() {
  startGeolocation();
  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
    try {
      const permission = await DeviceOrientationEvent.requestPermission();
      if (permission === 'granted') {
        window.addEventListener('deviceorientation', handleOrientation);
      } else {
        alert('[センサー] 許可が拒否されました');
      }
    } catch (err) {
      alert('[センサー] エラー: ' + err.message);
    }
  } else if ('DeviceOrientationEvent' in window) {
    window.addEventListener('deviceorientation', handleOrientation);
  }
  startSensorButton.disabled = true;
}

// =========================================================
// 5. テスト日時モードのUI操作
// =========================================================
toggleTestModeButton.addEventListener('click', () => {
  testModePanel.classList.toggle('open');
});

toggleNamesButton.addEventListener('click', () => {
  showAllNames = !showAllNames;
});

function getTapCoords(evt) {
  const rect = canvasEl.getBoundingClientRect();
  return { x: evt.clientX - rect.left, y: evt.clientY - rect.top };
}

canvasEl.addEventListener('click', (evt) => {
  const { x, y } = getTapCoords(evt);
  let nearest = null;
  let nearestDist = Infinity;
  starScreenPositions.forEach(s => {
    const dist = Math.hypot(s.x - x, s.y - y);
    if (dist < nearestDist) {
      nearestDist = dist;
      nearest = s;
    }
  });
  if (nearest && nearestDist <= TAP_HIT_RADIUS_PX) {
    tappedStar = { x: nearest.x, y: nearest.y, name: nearest.name, time: Date.now() };
  }
});

// 星名ラベルを描画する共通関数(背景付きで読みやすくする)
function drawStarLabel(x, y, text) {
  ctx.font = '13px sans-serif';
  const paddingX = 6, paddingY = 4;
  const textWidth = ctx.measureText(text).width;
  const boxX = x + 10;
  const boxY = y - 10 - 13;
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(boxX - paddingX, boxY - paddingY, textWidth + paddingX * 2, 13 + paddingY * 2);
  ctx.fillStyle = '#fff';
  ctx.fillText(text, boxX, boxY + 11);
}
applyTestTimeButton.addEventListener('click', () => {
  if (testDatetimeInput.value) {
    testDate = new Date(testDatetimeInput.value); // 端末のローカル時刻として解釈される
  }
  testModePanel.classList.remove('open'); // 反映したらパネルを自動で閉じる
});
clearTestTimeButton.addEventListener('click', () => {
  testDate = null;
  testDatetimeInput.value = '';
});

function effectiveNow() {
  return testDate || new Date();
}

// =========================================================
// 6. 毎フレーム: 星の位置を計算して画面に描画
// =========================================================
function drawFrame() {
  ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);

  const statusLines = [];

  if (!currentPosition) {
    statusLines.push('[位置情報] 取得待ち...');
  }
  if (currentHeading === null) {
    statusLines.push('[向き] 取得待ち...');
  }

  if (currentPosition && currentHeading !== null) {
    const now = effectiveNow();
    const lst = getLST(now, currentPosition.longitude);

    // 端末が向いている「仰角」。beta=90が水平(地平線)を向いている状態に相当すると仮定
    const deviceElevation = (currentTilt !== null ? currentTilt : 90) - 90;

    statusLines.push(
      (testDate ? '[テスト日時使用] ' : '[現在時刻] ') + now.toLocaleString('ja-JP')
    );
    statusLines.push(`向き:${currentHeading.toFixed(0)}° 仰角:${deviceElevation.toFixed(0)}°`);

    let visibleCount = 0;
    let drawnCount = 0;
    starScreenPositions = []; // 毎フレーム、画面に描画された星の座標をリセットして記録し直す

    starData.forEach(star => {
      const { altDeg, azDeg } = raDecToAltAz(star.raHours, star.decDeg, currentPosition.latitude, lst);
      if (altDeg <= 0) return; // 地平線より下は対象外
      visibleCount++;

      const azDiff = normalizeAngleDiff(azDeg - currentHeading);
      const altDiff = altDeg - deviceElevation;

      // 画角の範囲外なら描画しない
      if (Math.abs(azDiff) > CONFIG.FOV_HORIZONTAL_DEG / 2) return;
      if (Math.abs(altDiff) > CONFIG.FOV_VERTICAL_DEG / 2) return;

      const x = canvasEl.width / 2 + (azDiff / (CONFIG.FOV_HORIZONTAL_DEG / 2)) * (canvasEl.width / 2);
      const y = canvasEl.height / 2 - (altDiff / (CONFIG.FOV_VERTICAL_DEG / 2)) * (canvasEl.height / 2);

      drawnCount++;
      starScreenPositions.push({ x, y, name: star.name });

      // 星を描画
      ctx.beginPath();
      ctx.arc(x, y, CONFIG.STAR_DOT_RADIUS, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = '#ffffff';
      ctx.shadowBlur = 8;
      ctx.fill();
      ctx.shadowBlur = 0;

      // ON/OFFボタンがONなら、常時すべての星の名前を表示
      if (showAllNames) {
        drawStarLabel(x, y, star.name);
      }
    });

    // 月の描画(新規追加: 恒星と異なり視差補正込みの専用計算を使用)
    // オリオン座が見えにくい時期でも、月なら明るく見つけやすいため
    // 位置精度(FOVキャリブレーション)確認の第一段階として利用する
    const moonAltAz = getMoonAltAz(now, currentPosition.latitude, currentPosition.longitude, lst);
    statusLines.push(`月: 高度${moonAltAz.altDeg.toFixed(1)}° 方位${moonAltAz.azDeg.toFixed(1)}°` +
      (moonAltAz.altDeg <= 0 ? ' (地平線下)' : ''));

    if (moonAltAz.altDeg > 0) {
      const azDiff = normalizeAngleDiff(moonAltAz.azDeg - currentHeading);
      const altDiff = moonAltAz.altDeg - deviceElevation;

      if (Math.abs(azDiff) <= CONFIG.FOV_HORIZONTAL_DEG / 2 && Math.abs(altDiff) <= CONFIG.FOV_VERTICAL_DEG / 2) {
        const x = canvasEl.width / 2 + (azDiff / (CONFIG.FOV_HORIZONTAL_DEG / 2)) * (canvasEl.width / 2);
        const y = canvasEl.height / 2 - (altDiff / (CONFIG.FOV_VERTICAL_DEG / 2)) * (canvasEl.height / 2);

        starScreenPositions.push({ x, y, name: '月 (Moon)' });

        // 星と区別できるよう、大きめ・淡黄色で描画
        ctx.beginPath();
        ctx.arc(x, y, CONFIG.MOON_DOT_RADIUS, 0, Math.PI * 2);
        ctx.fillStyle = '#fff6d5';
        ctx.shadowColor = '#fff6d5';
        ctx.shadowBlur = 15;
        ctx.fill();
        ctx.shadowBlur = 0;

        if (showAllNames) {
          drawStarLabel(x, y, '月 (Moon)');
        }
      }
    }

    // タップで選択した星の名前を、一定時間だけ表示
    if (!showAllNames && tappedStar) {
      if (Date.now() - tappedStar.time < TAP_LABEL_DURATION_MS) {
        drawStarLabel(tappedStar.x, tappedStar.y, tappedStar.name);
      } else {
        tappedStar = null;
      }
    }

    statusLines.push(`地平線上の星:${visibleCount} / 画面内に描画:${drawnCount}`);
  }

  statusEl.textContent = statusLines.join('\n');
  requestAnimationFrame(drawFrame);
}

startCameraButton.addEventListener('click', startCamera);
startSensorButton.addEventListener('click', startSensors);

requestAnimationFrame(drawFrame);
</script>
